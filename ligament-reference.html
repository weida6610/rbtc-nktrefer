          "symptoms": "深臀部或坐骨粗隆內側不適，久坐、跨步或髖伸負荷時可能出現，可與近端腿後肌症狀重疊。",
          "commonPairs": [
            "同側 ST 與對側 SS。"
          ]
        },
        {
          "name": "SS 薦棘韌帶（Sacrospinous ligament）",
          "location": "薦骨、尾骨外側至坐骨棘，位於 ST 深層。原筆記以 ST 中點偏外上作體表參考。",
          "testMuscles": [
            "閉孔內肌",
            "骨盆底肌"
          ],
          "relatedMuscles": [
            "尾骨肌與 SS 相鄰，部分纖維重疊。"
          ],
          "bonesAndMotion": "薦骨／尾骨—坐骨棘，協助限制過度點頭，與 ST 共同界定坐骨大、小孔。",
          "symptoms": "可能與深臀部或骨盆底區症狀重疊。原筆記記錄骨盆底功能異常與漏尿，應另外評估其來源。",
          "commonPairs": [
            "同側 ST 與對側 SS。"
          ]
        }
      ],
      "notes": "### 骨盆髖後測試流程\n\n1. **PSIS 動態觸診。** 接觸 PSIS，受測者向前抬腿，比較兩側 PSIS 的後下移動感。記錄哪一側有差異。\n2. **俯臥薦骨觀察。** 比較雙側薦骨的凹凸、高低及局部反應，供 SI 區後續篩查。\n3. **俯臥髖伸重測。** 先比較左右髖伸，再加入薦骨接觸或輕壓重測。原筆記把髖伸較低側列為 ST 篩查側。\n4. **局部張力。** 用手法張力比較各接觸區，並重測原本的動作或熟悉症狀。\n\nPSIS 移動感和薦骨高低可記為動作觀察。若評估 SI 區疼痛來源，可比對病史及一組疼痛誘發測試。以觸診定位 SI 個別韌帶或薦骨分段旋轉的證據有限。"
    },
    {
      "id": "spine",
      "name": "脊椎",
      "intro": "",
      "entries": [
        {
          "name": "棘上韌帶",
          "location": "沿背側正中連接多節棘突尖端，NKT 可觀察表面凹凸折點。",
          "testMuscles": [],
          "relatedMuscles": [
            "鄰近組織：胸腰筋膜、豎脊肌腱膜、多裂肌"
          ],
          "bonesAndMotion": "相鄰多節棘突。矢狀面，與其他後方組織共同分擔前屈末端張力。觀察前彎、後仰時相對少動區。",
          "symptoms": "背側正中局部壓痛，前彎末端可能再現。原筆記亦觀察局部棘突凹凸及前彎、後仰少動。",
          "commonPairs": [
            "上、下兩到三節與 Lovett Reactor。"
          ]
        },
        {
          "name": "棘間韌帶",
          "location": "相鄰兩節棘突之間，位於棘上韌帶深側。",
          "testMuscles": [],
          "relatedMuscles": [
            "棘間肌、局部多裂肌及筋膜。"
          ],
          "bonesAndMotion": "相鄰棘突。矢狀面，協助抵抗屈曲時棘突分離。原筆記觀察前彎、後仰時 2–3 節同時少動。",
          "symptoms": "棘突間局部壓痛，前彎末端可能不適。"
        },
        {
          "name": "橫突間韌帶",
          "location": "位於相鄰橫突之間，各脊椎區段與肌筋膜融合的程度不同。",
          "testMuscles": [],
          "relatedMuscles": [
            "橫突間肌",
            "腰段可觀察腰方肌與鄰近深層豎脊肌"
          ],
          "bonesAndMotion": "相鄰橫突。以冠狀面為主，側彎時對側受張力，也可觀察耦合旋轉。",
          "symptoms": "局部偏側緊繃或痛，側彎或側彎合併旋轉可能再現。原筆記觀察側彎或旋轉折點過多或過少。"
        }
      ],
      "notes": "### 脊椎測試流程\n\n- 分別比較前彎、後仰、側彎及旋轉，記錄原筆記中的少動區、折點與是否重現熟悉症狀。\n- 腰椎節段觸診在不同檢查者間的一致性有限，可把觸診結果與主動動作一併記錄。"
    }
  ],
  "sources": "- 肩的 NKT 測試肌肉及配對取自 [RBTC NKT 檢測參考圖「肩韌帶－肌肉對應表」](https://nkt-refer.rbtctw.com/)。其他測試肌肉與流程依本次提供的 NKT 課堂筆記。\n- 肩部解剖與力學參考 [盂肱關節](https://www.ncbi.nlm.nih.gov/books/NBK537018/)、[肩鎖關節](https://www.ncbi.nlm.nih.gov/books/NBK499858/)、[胸鎖關節位移限制](https://pubmed.ncbi.nlm.nih.gov/11845148/)。\n- 膝部解剖與復健參考 [膝關節解剖](https://www.ncbi.nlm.nih.gov/books/NBK500017/)、[近端脛腓關節不穩](https://pubmed.ncbi.nlm.nih.gov/36913522/)、[Aspetar ACL 復健指引](https://doi.org/10.1136/bjsports-2022-106158)、[PCL 評估與處置回顧](https://pmc.ncbi.nlm.nih.gov/articles/PMC12875799/)。\n- 踝部解剖參考 [踝關節外科解剖](https://doi.org/10.1155/2013/182650)與 [足踝支持帶超音波解剖](https://pmc.ncbi.nlm.nih.gov/articles/PMC7151198/)。\n- 骨盆與髖部參考 [髖關節囊解剖與力學](https://pmc.ncbi.nlm.nih.gov/articles/PMC7406151/)、[腹股溝韌帶解剖](https://www.ncbi.nlm.nih.gov/books/NBK542321/figure/article-23528.image.f1/)、[恥骨聯合影像與解剖](https://doi.org/10.1148/rg.220058)、[骨盆筋膜](https://www.ncbi.nlm.nih.gov/books/NBK518984/)與 [薦髂關節複合體疼痛共識](https://pmc.ncbi.nlm.nih.gov/articles/PMC12681192/)。\n- 脊椎及肘部參考 [腰椎韌帶](https://www.wheelessonline.com/ISSLS/lumbar-vertebrae-ligaments/)、[下背痛觸診的信效度](https://pubmed.ncbi.nlm.nih.gov/34446040/)與 [肘副韌帶解剖](https://www.ncbi.nlm.nih.gov/books/NBK560907/)。\n\n- 測試判讀參考 [肩部理學檢查系統性回顧](https://bjsm.bmj.com/content/42/2/80.short)與 [應用肌動學徒手肌力測試信度回顧](https://pubmed.ncbi.nlm.nih.gov/41236460/)。"
}
</script>
<script>
  const data = JSON.parse(document.getElementById('reference-data').textContent);

  function element(tag, text, className) {
    const node = document.createElement(tag);
    if (text) node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  function inline(parent, text) {
    const tokens = /\*\*([^*]+)\*\*|\[([^\]]+)\]\((https:\/\/[^\s)]+)\)| {2}\r?\n/g;
    let start = 0;
    for (const match of text.matchAll(tokens)) {
      parent.append(text.slice(start, match.index));
      if (match[1]) parent.append(element('strong', match[1]));
      else if (match[2]) {
        const link = element('a', match[2]);
        link.href = match[3];
        parent.append(link);
      } else parent.append(element('br'));
      start = match.index + match[0].length;
    }
    parent.append(text.slice(start));
  }

  // Prose in the source uses only headings, lists, paragraphs and inline emphasis/links.
  function prose(parent, text) {
    for (const block of text.split(/\r?\n\s*\r?\n/).filter(Boolean)) {
      const lines = block.split(/\r?\n/);
      const heading = block.match(/^\*\*([^*]+)\*\*[ \t]*(?:\r?\n|$)/);
      if (block.startsWith('### ')) parent.append(element('h3', block.slice(4)));
      else if (heading) {
        parent.append(element('h4', heading[1]));
        if (lines.length > 1) {
          const paragraph = element('p');
          inline(paragraph, lines.slice(1).join('\n'));
          parent.append(paragraph);
        }
      } else if (/^(?:- |\d+\. )/.test(block)) {
        const list = element(block.startsWith('- ') ? 'ul' : 'ol');
        for (const line of lines) {
          const li = element('li');
          inline(li, line.replace(/^(?:- |\d+\. )/, ''));
          list.append(li);
        }
        parent.append(list);
      } else {
        const paragraph = element('p');
        inline(paragraph, block);
        parent.append(paragraph);
      }
    }
  }

  const normalize = text => text.normalize('NFKC').toLowerCase();
  const aliases = [
    ['肩外旋', '肩外轉', 'ER'], ['胸鎖乳突肌', 'SCM'], ['腓骨長肌', 'PL'],
    ['腓骨短肌', 'PB'], ['第三腓骨肌', 'PT'], ['脛前肌', 'TA'], ['脛後肌', 'TP'],
    ['趾長屈肌', '屈趾長肌', 'FDL'], ['前斜角肌', 'A.Scalene'],
    ['上斜方肌', 'U.Trap'], ['腰方肌', 'QL'], ['豎脊肌', 'ES'], ['多裂肌', 'Multifidus'],
    ['臀大肌', 'Gmax'], ['臀中肌', 'Gmed'], ['閉孔內肌', 'OI'],
    ['鎖間韌帶', 'TranseverseC'], ['薦結節韌帶', '骶結韌帶'],
    ['前距腓韌帶', 'Anterior talofibular ligament', 'Anterior talo-fibular ligament'],
    ['後距腓韌帶', 'Posterior talofibular ligament', 'Posterior talo-fibular ligament'],
    ['跟腓韌帶', 'CF', 'Calcaneofibular ligament', 'Calcaneo-fibular ligament'],
    ['前十字韌帶', 'Anterior cruciate ligament'], ['後十字韌帶', 'Posterior cruciate ligament'],
  ];
  const terms = value => normalize(value).match(/[a-z0-9]+|\p{Script=Han}+/gu) || [];
  const latinWords = value => normalize(value).match(/[a-z0-9]+/g) || [];

  function searchIndex(entry) {
    const primary = [entry.name, ...entry.testMuscles, ...entry.relatedMuscles].join(' ');
    const context = `${primary} ${entry.bonesAndMotion}`;
    const extras = aliases.flatMap(([label, ...synonyms]) =>
      (label === '肩外旋' ? context : primary).includes(label) ? [label, ...synonyms] : []);
    const value = normalize([primary, ...extras].join(' '));
    return { value, words: new Set(latinWords(value)) };
  }

  function bulletList(items, groupMuscles = false) {
    const list = element('ul', '', 'muscle-list');
    for (const item of items) {
      const group = groupMuscles && item.match(/^(同側|對側|上區|中區|下區|NKT 肩外轉測項|橫向測項|直向測項|帶下肌腱|鄰近組織|與區域張力有解剖或力學關聯)：(.+)$/);
      const li = element('li');
      if (group) {
        const names = group[2].split('、');
        li.append(element('strong', `${group[1]}：`, 'muscle-group'));
        li.append(names.length > 1 ? bulletList(names) : group[2]);
      } else li.textContent = item;
      list.append(li);
    }
    return list;
  }

  function muscleCell(items, pairs) {
    const content = element('div');
    content.append(items.length ? bulletList(items, true) : element('span', '—'));
    if (pairs?.length) {
      const block = element('div', '', 'pairings');
      block.append(element('strong', '常見配對'));
      block.append(pairs.length > 1 ? bulletList(pairs) : element('span', pairs[0]));
      content.append(block);
    }
    return content;
  }

  const columns = Object.entries(data.columns);
  function buildTable(region) {
    const table = element('table');
    table.setAttribute('role', 'table');
    table.setAttribute('aria-labelledby', `heading-${region.id}`);
    const head = table.createTHead();
    head.setAttribute('role', 'rowgroup');
    const header = head.insertRow();
    header.setAttribute('role', 'row');
    for (const [, label] of columns) {
      const th = element('th', label);
      th.scope = 'col';
      th.setAttribute('role', 'columnheader');
      header.append(th);
    }
    const body = table.createTBody();
    body.setAttribute('role', 'rowgroup');
    const rows = region.entries.map(entry => {
      const row = body.insertRow();
      row.setAttribute('role', 'row');
      for (const [key, label] of columns) {
        if (key === 'name') {
          const th = element('th', entry[key]);
          th.scope = 'row';
          th.setAttribute('role', 'rowheader');
          row.append(th);
        } else {
          const labelNode = element('span', label, 'cell-label');
          labelNode.setAttribute('aria-hidden', 'true');
          const cell = row.insertCell();
          cell.setAttribute('role', 'cell');
          const content = Array.isArray(entry[key])
            ? muscleCell(entry[key], key === 'testMuscles' ? entry.commonPairs : undefined)
            : element('span', entry[key]);
          cell.append(labelNode, content);
        }
      }
      return { row, ...searchIndex(entry) };
    });
    return { table, rows };
  }

  const query = document.getElementById('query');
  const resultRoot = document.getElementById('results');
  const count = document.getElementById('count');
  prose(document.getElementById('intro'), data.intro);
  prose(document.getElementById('sources'), data.sources);
  const groups = data.regions.map(region => {
    const section = element('section', '', 'region');
    const heading = element('h2', region.name);
    heading.id = `heading-${region.id}`;
    section.append(heading);
    if (region.intro) {
      const intro = element('div', '', 'region-intro');
      prose(intro, region.intro);
      section.append(intro);
    }
    const { table, rows } = buildTable(region);
    section.append(table);
    if (region.notes) {
      const notes = element('div', '', 'notes');
      prose(notes, region.notes);
      section.append(notes);
    }
    resultRoot.append(section);
    return { id: region.id, section, rows };
  });

  let selected = '';
  const buttons = [{ id: '', name: '全部' }, ...data.regions].map(({ id, name }) => {
    const button = element('button', name);
    button.type = 'button';
    button.addEventListener('click', () => {
      selected = id;
      filter();
    });
    document.getElementById('regions').append(button);
    return { id, button };
  });

  function filter() {
    const words = terms(query.value);
    let total = 0;
    for (const { id, button } of buttons) button.setAttribute('aria-pressed', id === selected);
    for (const { id, section, rows } of groups) {
      let visible = 0;
      for (const { row, value, words: indexWords } of rows) {
        row.hidden = !words.every(word => /^[a-z0-9]+$/.test(word) ? indexWords.has(word) : value.includes(word));
        if (!row.hidden) visible++;
      }
      section.hidden = (selected !== '' && selected !== id) || visible === 0;
      if (!section.hidden) total += visible;
    }
    count.textContent = total ? `${total} 條結構` : '沒有符合的結構';
  }

  query.addEventListener('input', filter);
  query.form.addEventListener('submit', event => event.preventDefault());
  filter();
</script>
</body>
